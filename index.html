<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>x2verdud hvh</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0d;
            color: #e5e5e5;
            min-height: 100vh;
        }

        nav {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;

            background: #111;
            border-bottom: 1px solid #222;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .categories {
            display: flex;
            gap: 25px;
        }

        .categories a {
            color: #777;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .categories a:hover,
        .categories a.active {
            color: #fff;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 70px 30px 300px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Home image */
        .home-image {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;

            border-radius: 22px;
            overflow: hidden;

            -webkit-mask-image: radial-gradient(
                ellipse at center,
                black 38%,
                rgba(0, 0, 0, 0.95) 55%,
                rgba(0, 0, 0, 0.55) 72%,
                transparent 100%
            );

            mask-image: radial-gradient(
                ellipse at center,
                black 38%,
                rgba(0, 0, 0, 0.95) 55%,
                rgba(0, 0, 0, 0.55) 72%,
                transparent 100%
            );

            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.45));
        }

        .home-image img {
            display: block;
            width: 100%;
            height: auto;

            filter: blur(2px);
            opacity: 0.82;

            transform: scale(1.025);
        }

        .home-image::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(13, 13, 13, 0.15),
                    transparent 25%,
                    transparent 75%,
                    rgba(13, 13, 13, 0.35)
                );

            pointer-events: none;
        }

        .rgb-text {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 100%;
            text-align: center;

            font-size: clamp(25px, 5vw, 55px);
            font-weight: 800;
            letter-spacing: 2px;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: rgb 30s linear infinite;

            filter:
                drop-shadow(0 3px 3px rgba(0, 0, 0, 0.9))
                drop-shadow(0 8px 15px rgba(0, 0, 0, 0.8))
                drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));

            z-index: 2;
        }

        @keyframes rgb {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 401% 50%;
            }
        }

        .server {
            padding: 30px;

            background: #111;
            border: 1px solid #222;
            border-radius: 6px;

            max-width: 600px;
            margin: 0 auto;
        }

        .server h1,
        .about h1 {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 15px;
        }

        .ip {
            font-family: monospace;
            font-size: 16px;
            color: #999;
        }

        .about {
            padding: 30px;

            background: #111;
            border: 1px solid #222;
            border-radius: 6px;

            max-width: 700px;
            margin: 0 auto;
        }

        .about p {
            color: #888;
            font-size: 15px;
            line-height: 1.7;
        }

        .space {
            height: 700px;
        }

        footer {
            padding: 18px 30px;

            color: #444;
            font-size: 12px;
            text-align: center;

            background: #0d0d0d;
            border-top: 1px solid #181818;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#" class="logo"
           onclick="showPage('home', document.querySelector('.categories a'))">
            x2verdud hvh
        </a>

        <div class="categories">

            <a href="#" class="active"
               onclick="showPage('home', this)">
                Home
            </a>

            <a href="#"
               onclick="showPage('server', this)">
                Server IP
            </a>

            <a href="#"
               onclick="showPage('about', this)">
                About
            </a>

        </div>
    </nav>

    <main>

        <section id="home" class="page active">

            <div class="home-image">
                <img src="image.png" alt="x2verdud HVH">

                <div class="rgb-text">
                    x2verdud HVH
                </div>
            </div>

            <div class="space"></div>

        </section>


        <section id="server" class="page">

            <div class="server">
                <h1>x2verdud hvh server ip</h1>

                <div class="ip">
                    x2verdud-hvh.net
                </div>
            </div>

            <div class="space"></div>

        </section>


        <section id="about" class="page">

            <div class="about">
                <h1>About</h1>

                <p>
                    this website is wip bro dont judge this yet currently
                    adding things like archive and configs and not just
                    stealing from nezha may have took a little "inspiration" :skull: :skull:
                </p>
            </div>

            <div class="space"></div>

        </section>

    </main>

    <footer>
        x2verdud hvh
    </footer>


    <script>
        function showPage(page, link) {

            document.querySelectorAll(".page").forEach(function(section) {
                section.classList.remove("active");
            });

            document.getElementById(page).classList.add("active");

            document.querySelectorAll(".categories a").forEach(function(item) {
                item.classList.remove("active");
            });

            link.classList.add("active");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    </script>

</body>
</html>
